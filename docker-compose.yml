services:
  db:
    image: mongo:7.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: .
    environment:
      DB: mongodb://db/mern-crud
      TRUST_PROXY: '1'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build: ./react-src
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      api:
        condition: service_healthy
        restart: true

volumes:
  mongo-data:
